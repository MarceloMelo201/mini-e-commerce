server:
  port: 8082

spring:
  application:
    name: order-service

  datasource:
    url:  jdbc:postgresql://orders-db:5432/orders_db
    username: admin
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
