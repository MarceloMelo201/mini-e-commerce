server:
  port: 8081

spring:
  application:
    name: product-service

  datasource:
    url:  jdbc:postgresql://products-db:5432/products_db
    username: admin
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
