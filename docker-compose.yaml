
services:

  # API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: mini-e-commerce-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - product-service
      - order-service

  # Product Service
  product-service:
    build: ./product-service
    container_name: mini-e-commerce-product-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://products-db:5432/products_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: "1234"
    depends_on:
      products-db:
        condition: service_healthy

  # Order Service
  order-service:
    build: ./order-service
    container_name: mini-e-commerce-order-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://orders-db:5432/orders_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: "1234"
    depends_on:
      orders-db:
        condition: service_healthy

  # Product Database
  products-db:
    image: postgres:16
    container_name: mini-e-commerce-products-db
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5438:5432"
    volumes:
      - products-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d products_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Order Database
  orders-db:
    image: postgres:16
    container_name: mini-e-commerce-orders-db
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5439:5432"
    volumes:
      - orders-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  products-data:
  orders-data:
